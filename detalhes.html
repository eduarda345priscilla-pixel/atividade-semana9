
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Detalhes do Produto - Sneaker Store</title>

  
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">


  <link rel="stylesheet" href="style.css">
</head>

<body>

  
  <header class="topbar">
    <div class="container header-content">

      <a href="index.html" class="brand">
        SNEAKER STORE
      </a>

      <nav class="site-nav">
        <a href="index.html">Início</a>
        <a href="index.html#produtos">Todos os Tênis</a>
        <a href="index.html#sobre">Sobre</a>
      </nav>

    </div>
  </header>


  <main class="container">

    
    <a href="index.html"
       class="btn btn-dark back-link">
      ← Voltar para a loja
    </a>


   
    <section class="section-space">

      <h2 class="section-heading">
        Informações Gerais
      </h2>

      
      <div id="product-details">
        <p>Carregando produto...</p>
      </div>

    </section>


   
    <section id="product-photos"
             class="section-space">

      <div class="gallery-heading">

        <h2 class="section-heading">
          Fotos do Produto
        </h2>

       
        <div class="gallery-controls">

          <button id="galleryPrev"
                  type="button"
                  aria-label="Fotos anteriores">
            ←
          </button>

          <button id="galleryNext"
                  type="button"
                  aria-label="Próximas fotos">
            →
          </button>

        </div>
      </div>

     
      <div id="gallery-track"
           class="gallery-track">
      </div>

    </section>

  </main>



  <footer class="footer">
    <div class="container">
      Sneaker Store - Projeto Acadêmico
    </div>
  </footer>



  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>

  
  <script src="script.js"></script>

</body>
</html>

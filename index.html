
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sneaker Store - Catálogo de Tênis</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Sneaker Store</h1>
    <p>Encontre o tênis perfeito para você!</p>
  </header>

  <main>
    <section class="controls">

      <input
        type="text"
        id="search"
        placeholder="Buscar por modelo de tênis..."
      >

      <select id="category">
        <option value="Todas">Todas</option>
      </select>

      <button id="btnRender">Renderizar</button>

    </section>

    <section id="product-list" class="grid-container">
    </section>
  </main>

  <script src="script.js"></script>

</body>
</html>
